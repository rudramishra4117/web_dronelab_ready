server {
    listen 80;
    server_name localhost;
    client_max_body_size 500M;

    # 1. API Requests -> Django Backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin / Media / Static
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
    }
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }
    location /media/ {
        alias /media/;
        add_header Access-Control-Allow-Origin *;
    }

    # 2. 3D-Cad Service -> Protected by Auth
    location /cad/ {
        # Check authentication first
        auth_request /auth_check;
        
        # If authorized, proxy to CAD container
        # Note: trailing slash strips /cad/ before passing to the upstream
        proxy_pass http://cad:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # If unauthorized (401), redirect to login page on the frontend
        error_page 401 = @error401;
    }

    location @error401 {
        return 302 /auth?tab=login&next=$request_uri;
    }

    # Internal authentication endpoint
    location = /auth_check {
        internal;
        
        # Forward request to Django's /api/auth/me
        proxy_pass http://backend:8000/api/auth/me;
        
        # Do not send original request body
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        
        # Extract JWT from a cookie we will set on the frontend ("dronelab_jwt")
        proxy_set_header Authorization "Bearer $cookie_dronelab_jwt";
    }

    # 3. Everything else -> React Frontend
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
